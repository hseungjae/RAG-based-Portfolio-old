worker_processes auto;

events {}

http {

    include mime.types;
    default_type application/octet-stream;

    # 로그 형식. upstream 응답 시간(ut)으로 System 서버의 답변 지연을 볼 수 있다.
    log_format  main_ext  '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time '
                    'ua="$upstream_addr" us="$upstream_status" '
                    'ut="$upstream_response_time"';

    server {
        listen 80;
        server_name localhost;

        access_log  /var/log/nginx/access.log main_ext;
        error_log  /var/log/nginx/error.log warn;

        root /usr/share/nginx/html;

        # 프론트엔드. index.html 은 매번 변경 여부를 확인해야 새 배포의 JS/CSS 주소를 바로 받는다
        location / {
            index index.html;
            try_files $uri $uri/ /index.html;
            add_header Cache-Control "no-cache";
        }

        # 빌드 결과 파일 이름에 내용 해시가 붙어 있으므로 오래 캐시해도 된다
        location /assets/ {
            try_files $uri =404;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        # <link rel="icon">를 읽지 않는 브라우저·봇도 같은 아이콘을 받게 한다
        location = /favicon.ico {
            try_files /favicon.svg =404;
            default_type image/svg+xml;
        }

        # API 요청을 백엔드(k3s 의 system 서비스)로 프록시
        location /api/ {
            proxy_pass http://system;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            # CF-Connecting-IP 같은 요청 헤더는 그대로 전달되므로 System 의 IP별 요청 제한이 계속 동작한다

            # 답변(SSE)을 모아 두지 않고 조각마다 바로 보낸다
            proxy_buffering off;
            proxy_cache off;
            # 무료 Gemini API 는 첫 응답까지 오래 걸리기도 한다
            proxy_read_timeout 300s;
        }
    }
}
