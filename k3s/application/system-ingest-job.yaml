# 자기소개 문서(dataset/profile)를 임베딩해 DB 에 넣는다. DB 가 아직 준비 전이면 실패 후 재시도한다.
# 문서를 고쳐 다시 적재할 때: 이미지 다시 빌드·import → 이 Job 을 delete 후 다시 apply.
apiVersion: batch/v1
kind: Job
metadata:
  name: system-ingest
  namespace: rag-portfolio
spec:
  backoffLimit: 6
  ttlSecondsAfterFinished: 86400
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: ingest
          image: system:latest
          imagePullPolicy: Never
          command: ["python", "-m", "scripts.ingest"]
          envFrom:
            - secretRef:
                name: system-secret
            - secretRef:
                name: database-secret
