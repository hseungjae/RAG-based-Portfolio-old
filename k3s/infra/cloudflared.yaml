# Cloudflare Tunnel(rag-portfolio)을 클러스터 안에서 실행한다. chat.sjhan.com → react-app 서비스(nginx, /api 는 system 으로).
# 서버 포트를 열 필요가 없다. 터널 자격 증명은 cloudflared-secret 으로 넣는다.
apiVersion: v1
kind: ConfigMap
metadata:
  name: cloudflared-config
  namespace: rag-portfolio
data:
  config.yml: |
    tunnel: 187ee1ae-4498-4b5d-9346-cbfb46de41fe
    credentials-file: /etc/cloudflared/creds/credentials.json
    metrics: 0.0.0.0:2000
    no-autoupdate: true
    ingress:
      - hostname: chat.sjhan.com
        service: http://react-app:80
      - service: http_status:404
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflared
  namespace: rag-portfolio
spec:
  revisionHistoryLimit: 1
  replicas: 1
  selector:
    matchLabels:
      app: cloudflared
  template:
    metadata:
      labels:
        app: cloudflared
    spec:
      containers:
        - name: cloudflared
          image: cloudflare/cloudflared:2026.10.0
          args: ["tunnel", "--config", "/etc/cloudflared/config/config.yml", "run"]
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
          livenessProbe:
            httpGet:
              path: /ready
              port: 2000
            initialDelaySeconds: 10
            periodSeconds: 30
          volumeMounts:
            - name: config
              mountPath: /etc/cloudflared/config
              readOnly: true
            - name: creds
              mountPath: /etc/cloudflared/creds
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: cloudflared-config
        - name: creds
          secret:
            secretName: cloudflared-secret
